<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="arrow-bus" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366F1"/>
    </marker>
    <marker id="arrow-http" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-state" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#0F172A"/>
  <text x="48" y="56" fill="#F8FAFC" font-size="26" font-weight="700">SOS Public Kernel</text>
  <text x="48" y="84" fill="#94A3B8" font-size="14">Generic operator view. Hosted products can replace this SVG with SOS_SERVICE_MAP_SVG_PATH.</text>

  <g fill="#1E293B" stroke="#334155" stroke-width="2">
    <rect x="80" y="150" width="220" height="90" rx="10"/>
    <rect x="490" y="150" width="220" height="90" rx="10"/>
    <rect x="900" y="150" width="220" height="90" rx="10"/>
    <rect x="80" y="380" width="220" height="90" rx="10"/>
    <rect x="490" y="380" width="220" height="90" rx="10"/>
    <rect x="900" y="380" width="220" height="90" rx="10"/>
  </g>

  <g font-size="18" font-weight="700" fill="#F8FAFC">
    <text x="190" y="190" text-anchor="middle">MCP Clients</text>
    <text x="600" y="190" text-anchor="middle">MCP Gateway</text>
    <text x="1010" y="190" text-anchor="middle">Tool Registry</text>
    <text x="190" y="420" text-anchor="middle">Agent Bus</text>
    <text x="600" y="420" text-anchor="middle">Kernel State</text>
    <text x="1010" y="420" text-anchor="middle">Host Overlays</text>
  </g>

  <g font-size="12" fill="#94A3B8">
    <text x="190" y="214" text-anchor="middle">Claude, Codex, local agents</text>
    <text x="600" y="214" text-anchor="middle">JSON-RPC, SSE, auth hooks</text>
    <text x="1010" y="214" text-anchor="middle">send, inbox, broadcast, recall</text>
    <text x="190" y="444" text-anchor="middle">streams and subscriptions</text>
    <text x="600" y="444" text-anchor="middle">registry, memory, audit</text>
    <text x="1010" y="444" text-anchor="middle">operator-owned plugins</text>
  </g>

  <g fill="none" stroke-width="3">
    <path d="M300,195 C370,195 420,195 490,195" stroke="#64748B" marker-end="url(#arrow-http)"/>
    <path d="M710,195 C780,195 830,195 900,195" stroke="#64748B" marker-end="url(#arrow-http)"/>
    <path d="M600,240 C600,300 190,300 190,380" stroke="#6366F1" marker-end="url(#arrow-bus)"/>
    <path d="M600,240 C600,300 600,320 600,380" stroke="#A78BFA" marker-end="url(#arrow-state)"/>
    <path d="M1010,240 C1010,300 1010,320 1010,380" stroke="#64748B" marker-end="url(#arrow-http)"/>
    <path d="M300,425 C370,425 420,425 490,425" stroke="#6366F1" marker-end="url(#arrow-bus)"/>
    <path d="M710,425 C780,425 830,425 900,425" stroke="#A78BFA" marker-end="url(#arrow-state)"/>
  </g>

  <g font-size="12" fill="#CBD5E1">
    <text x="395" y="180" text-anchor="middle">HTTP/SSE</text>
    <text x="805" y="180" text-anchor="middle">list/call tools</text>
    <text x="395" y="410" text-anchor="middle">message events</text>
    <text x="805" y="410" text-anchor="middle">mount points</text>
  </g>

  <rect x="80" y="570" width="1040" height="72" rx="10" fill="#111827" stroke="#334155"/>
  <text x="104" y="600" fill="#F8FAFC" font-size="15" font-weight="700">Boundary</text>
  <text x="104" y="624" fill="#94A3B8" font-size="13">The public kernel ships protocol, bus, registry, and operator hooks. Product-specific routes, billing, and hosted topology belong in overlays.</text>
</svg>
