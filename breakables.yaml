# breakables.yaml — generic SOS kernel breakable registry
#
# Operators can keep deployment-specific probes in breakables.local.yaml.
# That local overlay is gitignored so public kernel forks do not inherit one
# operator's hostnames, ports, agents, or alert topology.

breakables:
  - id: redis
    type: internal-service
    endpoint: redis://127.0.0.1:6379
    probe: { check: ping, timeout_s: 2 }
    severity: critical
    owner: operator
    affects: [bus, agent registry, sessions]

  - id: bus-gateway
    type: internal-service
    endpoint: http://localhost:6070/health
    probe: { interval_s: 60, timeout_s: 3, expect_json: '.status == "ok"' }
    severity: critical
    owner: operator
    affects: [mcp clients, bus messages]
    dependencies: [redis]

  - id: squad-service
    type: internal-service
    endpoint: http://localhost:8060/health
    probe: { interval_s: 60, timeout_s: 3, expect_json: '.status == "ok"' }
    severity: critical
    owner: operator
    affects: [tasks, squads, agent registry]
    dependencies: [redis]

  - id: mirror-service
    type: internal-service
    endpoint: http://localhost:8844/health
    probe: { interval_s: 60, timeout_s: 3 }
    severity: high
    owner: operator
    affects: [memory, recall]

  - id: disk-root
    type: disk
    endpoint: /
    probe: { check: df_percent, warn_pct: 85, crit_pct: 92 }
    severity: critical
    owner: operator

  - id: anthropic-api
    type: external-provider
    endpoint: https://api.anthropic.com/v1/messages
    probe: { check: trivial_completion, timeout_s: 5 }
    severity: high
    owner: operator

  - id: openai-api
    type: external-provider
    endpoint: https://api.openai.com/v1/chat/completions
    probe: { check: trivial_completion, timeout_s: 5 }
    severity: high
    owner: operator

  - id: google-gemini-api
    type: external-provider
    endpoint: https://generativelanguage.googleapis.com/v1/models
    probe: { check: trivial_completion, timeout_s: 5 }
    severity: medium
    owner: operator
